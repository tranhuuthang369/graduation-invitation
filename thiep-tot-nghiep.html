<style>
:root{
  --bg:#f6f0e6;
  --card:#fffaf1;
  --ink:#3b2417;
  --mute:#7a6455;
  --line:#e2d3bd;
  --accent:#8a2a2a;
  --onacc:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1d1612;
    --card:#2a211c;
    --ink:#f1e6d6;
    --mute:#b7a592;
    --line:#4a3a30;
    --accent:#d9695f;
    --onacc:#1d1612
  }
}
:root[data-theme="dark"]{
  --bg:#1d1612;
  --card:#2a211c;
  --ink:#f1e6d6;
  --mute:#b7a592;
  --line:#4a3a30;
  --accent:#d9695f;
  --onacc:#1d1612
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

/* ----------------------------------------------------
   Trang tạo link cá nhân hoá
   ---------------------------------------------------- */
#gen{max-width:460px;margin:0 auto;padding:28px 20px 40px}
#gen h1{font-size:22px;margin:0 0 6px}
#gen p{color:var(--mute);margin:0 0 20px;font-size:14px;line-height:1.5}
#gen label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
#gen input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
#gen input:focus{border-color:var(--accent)}
#link{margin-top:16px;font-size:13px;color:var(--mute);word-break:break-all}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;font:inherit;font-weight:600;font-size:15px;padding:13px;border-radius:12px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;text-align:center;text-decoration:none}
.btn.p{background:var(--accent);color:var(--onacc)}
#ok{height:20px;margin-top:10px;font-size:13px;color:var(--accent)}

/* ----------------------------------------------------
   Khung sân khấu thiệp mời (Mobile 393x852)
   ---------------------------------------------------- */
#card{position:fixed;inset:0;overflow:hidden;background:#2a211c;display:none}
#stage{position:absolute;left:50%;top:50%;width:393px;height:852px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden;user-select:none}
.f{position:absolute;inset:0;width:393px;height:852px;opacity:0;transform:scale(1.06);transition:opacity 1.1s ease,transform 2s cubic-bezier(.22,1,.36,1);will-change:opacity,transform;pointer-events:none}
.f.on{opacity:1;transform:scale(1)}
.hit{position:absolute;border:0;background:none;padding:0;cursor:pointer;z-index:20}
.hint{position:absolute;opacity:0;transition:opacity .5s;pointer-events:none;text-align:center;color:#fff;font:700 15px "Dancing Script",cursive;text-shadow:0 1px 4px rgba(0,0,0,.7);z-index:15}
.ring{width:54px;height:54px;margin:0 auto 6px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 8px rgba(0,0,0,.4);animation:pl 1.6s ease-out infinite}
@keyframes pl{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.25);opacity:0}}
[data-step="1"] .h1,[data-step="2"] .h2{opacity:1}

/* Dòng chữ viết tay đầu trang - Stroke reveal animation */
.cap{
  position:absolute;
  left:0;
  right:0;
  top:120px;
  text-align:center;
  font:700 22px "Dancing Script",cursive;
  color:#fff;
  text-shadow:0 1px 6px rgba(0,0,0,.65);
  padding:0 30px;
  opacity:0;
  clip-path:inset(0 100% 0 0);
  transition:opacity 0.8s ease 0.3s, clip-path 1.6s cubic-bezier(.22,1,.36,1) 0.3s;
  pointer-events:none;
}
[data-step="1"] .cap,[data-step="2"] .cap,[data-step="3"] .cap{
  opacity:1;
  clip-path:inset(0 0% 0 0);
}

.btn-change-name {
  position: absolute;
  top: 18px;
  right: 18px;
  z-index: 100;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: rgba(28, 21, 17, 0.8);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(212, 175, 55, 0.5);
  border-radius: 20px;
  color: #f7e7b4;
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
  transition: all 0.25s ease;
}
.btn-change-name:hover {
  background: rgba(42, 32, 25, 0.95);
  border-color: rgba(212, 175, 55, 0.85);
  color: #fff;
  transform: translateY(-2px);
}

/* Nội dung thư viết tay trên nền giấy vintage */
#txt{
  position:absolute;
  left:57px;
  top:319px;
  width:270px;
  height:284px;
  overflow:hidden;
  font:500 14px/19.4px "Dancing Script",cursive;
  color:#6a3d27;
  text-align:justify;
  opacity:0;
  pointer-events:none;
  transition:opacity 1s ease .5s;
  z-index:10;
}
[data-step="4"] #txt{opacity:1;pointer-events:auto}
#txt p{margin:0;text-indent:22px;opacity:0;transform:translateY(12px);transition:opacity 1s ease,transform 1.1s cubic-bezier(.22,1,.36,1)}
[data-step="4"] #txt p{opacity:1;transform:none}
[data-step="4"] #txt p:nth-child(1){transition-delay:.9s}
[data-step="4"] #txt p:nth-child(2){transition-delay:1.5s}
[data-step="4"] #txt p:nth-child(3){transition-delay:2.1s}
[data-step="4"] #txt p:nth-child(4){transition-delay:2.7s}
#txt p.c{text-indent:0;margin-top:19px;text-align:left}
#txt b{font-weight:700;color:#4a2515}
#txt a{color:inherit;text-decoration:none;border-bottom:1px dashed #8a4a2b}

/* Hiệu ứng tô vàng bút dạ quang trong 1.2s */
.hl{
  display:inline-block;
  background:linear-gradient(104deg, rgba(255,224,102,0) 0%, rgba(255,224,102,0.7) 15%, rgba(255,214,0,0.65) 85%, rgba(255,224,102,0) 100%);
  background-size:0% 100%;
  background-repeat:no-repeat;
  border-radius:3px;
  padding:0 3px;
  transition:background-size 1.2s ease-out;
}
.hl.on{background-size:100% 100%}

/* Bụi sáng CSS dự phòng */
.dust{position:absolute;bottom:-12px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,190,.95),rgba(255,236,190,0) 70%);pointer-events:none;opacity:0;animation:dr linear infinite}
@keyframes dr{0%{transform:translate(0,0);opacity:0}15%{opacity:.75}85%{opacity:.5}100%{transform:translate(var(--dx),-900px);opacity:0}}
.gl .f,.gl .dust{display:none}

/* Ripple chạm tương tác */
#stage canvas{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.rip{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid rgba(255,255,255,.9);pointer-events:none;animation:rp .8s ease-out forwards;z-index:30}
@keyframes rp{to{transform:scale(5);opacity:0}}

/* ----------------------------------------------------
   Các nút tiện ích kết thư (Thêm vào lịch, Chỉ đường)
   ---------------------------------------------------- */
.end-actions{
  position:absolute;
  bottom:168px;
  left:50%;
  transform:translateX(-50%) translateY(10px);
  display:flex;
  gap:12px;
  width:270px;
  justify-content:center;
  opacity:0;
  transition:opacity 0.8s ease, transform 0.8s cubic-bezier(.22,1,.36,1);
  pointer-events:none;
  z-index:25;
}
.end-actions.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
  pointer-events:auto;
}
.act-btn{
  flex:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:8px 12px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:12px;
  font-weight:600;
  border-radius:20px;
  cursor:pointer;
  text-decoration:none;
  border:1px solid rgba(212,175,55,0.45);
  background:rgba(28,21,17,0.85);
  color:#f5e6d3;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:0 4px 15px rgba(0,0,0,0.4);
  transition:transform 0.2s, background 0.2s, border-color 0.2s;
}
.act-btn:hover{
  transform:translateY(-2px);
  background:rgba(42,32,25,0.95);
  border-color:rgba(212,175,55,0.8);
  color:#fff;
}
.act-btn svg{flex-shrink:0;color:#d4af37}

/* Bản dự phòng khi bật giảm chuyển động */
@media (prefers-reduced-motion:reduce){
  .f,.cap,.hint,#txt,#txt p,.end-actions{transition-duration:.01s!important;transition-delay:0s!important;transform:none!important}
  .ring,.rip{animation:none}
  .dust{display:none}
  .cap{clip-path:none!important}
  .hl{background-size:100% 100%!important}
}
</style>
</head>

(function(){

}

// Render nội dung thư viết tay - Tên hiển thị đúng tại 3 vị trí
const txtEl = $('txt');
txtEl.innerHTML =

// =========================================================================
// 4. THREE.JS CINEMATIC 3D ENGINE
// =========================================================================
function initFX() {
  if (!window.THREE || matchMedia('(prefers-reduced-motion:reduce)').matches) {
    throw new Error('Fallback to CSS animations');
  }

  const T = THREE;
  const W = 393, H = 852;
  const FOV = 40;
  const D = H / 2 / Math.tan(FOV * Math.PI / 360);
  const stageEl = $('stage');

  // Renderer với pixelRatio an toàn <= 2.5
  const rn = new T.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  const cv = rn.domElement;
  stageEl.insertBefore(cv, stageEl.firstChild);

  function resizeRenderer() {
    const s = parseFloat(stageEl.style.getPropertyValue('--s')) || 1;
    rn.setPixelRatio(Math.min(2.5, (window.devicePixelRatio || 1) * s));
    rn.setSize(W, H);
  }
  addEventListener('resize', resizeRenderer);
  resizeRenderer();

  const sc = new T.Scene();
  const cam = new T.PerspectiveCamera(FOV, W / H, 10, 6000);

  function createTextureCanvas(w, h, drawFn) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    drawFn(c.getContext('2d'), w, h);
    return new T.CanvasTexture(c);
  }

  // 4 Planes chính tương ứng 4 Frames
  const planes = [];
  [1, 2, 3, 4].forEach((idx) => {
    const mat = new T.MeshBasicMaterial({ transparent: true, opacity: (idx === 1 ? 1 : 0), depthWrite: false, visible: false });
    const mesh = new T.Mesh(new T.PlaneGeometry(W * 1.04, H * 1.04), mat);
    mesh.renderOrder = idx;
    mesh.userData = {
      o: (idx === 1 ? 1 : 0),
      scale: (idx === 2 ? 0.35 : 1.04),
      x: (idx === 2 ? -45 : 0),
      y: (idx === 2 ? -160 : 0),
      ry: (idx === 2 ? 0.35 : 0),
      rx: 0
    };
    mesh.scale.setScalar(mesh.userData.scale);
    mesh.position.set(mesh.userData.x, mesh.userData.y, idx * 0.4);
    sc.add(mesh);
    planes.push(mesh);

    const imgEl = $('f' + idx);
    if (imgEl) {
      new T.TextureLoader().load(imgEl.src, (tex) => {
        mat.map = tex;
        mat.visible = true;
        mat.needsUpdate = true;
        if (idx === 1) card.classList.add('gl');
      });
    }
  });

  // Hạt phát sáng dùng chung
  const glowTex = createTextureCanvas(64, 64, (ctx) => {
    const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, CONFIG.colors.dustGlow);
    g.addColorStop(0.4, 'rgba(255,225,160,0.35)');
    g.addColorStop(1, 'rgba(255,225,160,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 64, 64);
  });

  const AdditiveBlending = T.AdditiveBlending;

  // A. Bụi sáng đa tầng (85 hạt)
  const N = CONFIG.particles.dustCount;
  const dustPos = new Float32Array(N * 3);
  const dustSpeeds = [];
  for (let i = 0; i < N; i++) {
    dustPos[i * 3] = (Math.random() - 0.5) * 600;
    dustPos[i * 3 + 1] = (Math.random() - 0.5) * 950;
    dustPos[i * 3 + 2] = 20 + Math.random() * 280;
    dustSpeeds.push(8 + Math.random() * 14, Math.random() * 6.28);
  }
  const dustGeo = new T.BufferGeometry();
  dustGeo.setAttribute('position', new T.BufferAttribute(dustPos, 3));
  const dustPoints = new T.Points(dustGeo, new T.PointsMaterial({
    map: glowTex, size: 14, transparent: true, opacity: 0.8, blending: AdditiveBlending, depthWrite: false
  }));
  dustPoints.renderOrder = 10;
  dustPoints.frustumCulled = false;
  sc.add(dustPoints);

  // B. Tia nắng xiên lướt nhẹ qua tường
  const raysTex = createTextureCanvas(256, 512, (ctx, w, h) => {
    for (let k = 0; k < 5; k++) {
      const a = k * 50 + 60;
      const g = ctx.createLinearGradient(a - 60, 0, a + 30, 0);
      g.addColorStop(0, 'rgba(255,240,200,0)');
      g.addColorStop(0.5, 'rgba(255,240,200,' + (0.2 + (k % 2) * 0.12) + ')');
      g.addColorStop(1, 'rgba(255,240,200,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(a, 0); ctx.lineTo(a + 30, 0); ctx.lineTo(a - 90, h); ctx.lineTo(a - 120, h);
      ctx.fill();
    }
  });
  const raysMesh = new T.Mesh(new T.PlaneGeometry(700, 1100), new T.MeshBasicMaterial({
    map: raysTex, transparent: true, opacity: 0.2, blending: AdditiveBlending, depthWrite: false
  }));
  raysMesh.position.set(80, 0, 30);
  raysMesh.renderOrder = 9;
  sc.add(raysMesh);

  // C. 10 Lá rơi 3D và 18 Cánh hoa hồng (renderOrder = 8, không che chữ)
  function createLeafTex(c1, c2, isPetal) {
    return createTextureCanvas(48, 32, (ctx, w, h) => {
      ctx.translate(w / 2, h / 2);
      ctx.fillStyle = c1;
      ctx.beginPath();
      ctx.ellipse(0, 0, isPetal ? 14 : 20, isPetal ? 11 : 9, 0, 0, 6.3);
      ctx.fill();
      ctx.strokeStyle = c2;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-16, 0); ctx.lineTo(16, 0); ctx.stroke();
    });
  }
  const leafMats = [
    createLeafTex('#58752f', '#2f4318', false),
    createLeafTex('#b98f3c', '#6b4d16', false),
    createLeafTex('#b3262e', 'rgba(70,0,10,0.45)', true)
  ].map((tex) => new T.MeshBasicMaterial({ map: tex, transparent: true, side: T.DoubleSide, depthWrite: false }));

  const leaves = [];
  let petalsEndTime = 0;

  function resetLeaf(mesh, isFirst) {
    const u = mesh.userData;
    if (u.isPetal) {
      mesh.position.set((Math.random() - 0.5) * 380, 450 + Math.random() * (isFirst ? 350 : 120), 10 + Math.random() * 150);
      u.vy = 40 + Math.random() * 40;
    } else {
      mesh.position.set(Math.random() * 200, isFirst ? -100 + Math.random() * 540 : 440 + Math.random() * 60, 20 + Math.random() * 180);
      u.vy = 22 + Math.random() * 22;
    }
    u.vx = -6 - Math.random() * 8;
    u.phase = Math.random() * 6;
    u.rx = Math.random() * 2;
    u.ry = Math.random() * 2;
    u.rz = Math.random() * 1.5;
  }

  const totalFlora = CONFIG.particles.leafCount + CONFIG.particles.petalCount;
  for (let i = 0; i < totalFlora; i++) {
    const isPetal = i >= CONFIG.particles.leafCount;
    const mesh = new T.Mesh(new T.PlaneGeometry(isPetal ? 13 : 17, isPetal ? 16 : 10), leafMats[isPetal ? 2 : (i % 2)]);
    mesh.userData = { isPetal: isPetal };
    mesh.renderOrder = isPetal ? 8 : 11; // Cánh hoa rơi phía sau chữ
    mesh.visible = !isPetal;
    resetLeaf(mesh, true);
    sc.add(mesh);
    leaves.push(mesh);
  }

  // D. Tia lửa loé sáng khi nứt con dấu
  const B = CONFIG.particles.sparkCount;
  const sparkPos = new Float32Array(B * 3);
  const sparkVel = new Float32Array(B * 3);
  const sparkGeo = new T.BufferGeometry();
  sparkGeo.setAttribute('position', new T.BufferAttribute(sparkPos, 3));
  const sparkMat = new T.PointsMaterial({
    map: glowTex, size: 12, color: CONFIG.colors.sparkGold, transparent: true, opacity: 0, blending: AdditiveBlending, depthWrite: false
  });
  const sparkPoints = new T.Points(sparkGeo, sparkMat);
  sparkPoints.renderOrder = 12;
  sparkPoints.frustumCulled = false;
  sc.add(sparkPoints);

  const flareSprite = new T.Sprite(new T.SpriteMaterial({ map: glowTex, blending: AdditiveBlending, transparent: true, depthWrite: false, opacity: 0 }));
  flareSprite.position.set(-5, -23, 60);
  flareSprite.renderOrder = 13;
  sc.add(flareSprite);

  let burstTime = 9, flareTime = 9;
  function triggerBurst() {
    for (let i = 0; i < B; i++) {
      const an = Math.random() * 6.283;
      const v = 60 + Math.random() * 220;
      sparkPos[i * 3] = -5;
      sparkPos[i * 3 + 1] = -23;
      sparkPos[i * 3 + 2] = 60;
      sparkVel[i * 3] = Math.cos(an) * v;
      sparkVel[i * 3 + 1] = Math.sin(an) * v + 40;
      sparkVel[i * 3 + 2] = (Math.random() - 0.5) * 120;
    }
    burstTime = 0;
    flareTime = 0;
  }

  // Camera Dolly & Parallax Controller
  let px = 0, py = 0;
  let cx = 0, cy = 0, cz = D, targetZ = D;
  let currentStep = 1;
  let t0 = performance.now();
  let isTabVisible = true;

  document.addEventListener('visibilitychange', () => {
    isTabVisible = !document.hidden;
    if (isTabVisible) t0 = performance.now();
  });

  addEventListener('pointermove', (e) => {
    px = (e.clientX / innerWidth - 0.5) * 2;
    py = (e.clientY / innerHeight - 0.5) * 2;
  });

  addEventListener('deviceorientation', (e) => {
    if (e.gamma == null) return;
    px = Math.max(-1, Math.min(1, e.gamma / CONFIG.parallax.tiltFactor));
    py = Math.max(-1, Math.min(1, (e.beta - 45) / CONFIG.parallax.tiltFactor));
  });

  txtEl.style.transformOrigin = '139.5px 107px';

  // Animation Loop duy nhất (1 rAF)
  function renderLoop() {
    requestAnimationFrame(renderLoop);
    if (!isTabVisible) return;

    const now = performance.now();
    const dt = Math.min(0.05, (now - t0) / 1000);
    const t = now / 1000;
    t0 = now;

    // Khi ở bước 4: tắt parallax (mu = 0) để chữ KHỚP PIXEL hoàn hảo với trang giấy
    const mu = (currentStep >= 4) ? 0 : 1;
    const k = 1 - Math.exp(-dt * (currentStep >= 4 ? 3.2 : 1.8));

    cz += (targetZ - cz) * k;
    cx += (px * mu * CONFIG.parallax.mouseFactor - cx) * k;
    cy += (-py * mu * (CONFIG.parallax.mouseFactor * 0.7) - cy) * k;
    cam.position.set(cx, cy, cz);
    cam.lookAt(0, 0, 0);

    // Crossfade và scale từng frame theo đường cong Bezier và Dolly Zoom
    planes.forEach((p, idx) => {
      const u = p.userData;
      let targetOp = 0;
      let targetScale = 1.04;
      let targetX = 0;
      let targetY = 0;
      let targetRy = 0;
      let targetRx = 0;

      if (idx === 0) {
        // Frame 1: Ghế đá (Dolly in khi rời bước 1)
        targetOp = (currentStep === 1) ? 1 : 0;
        if (currentStep >= 2) {
          targetScale = 2.4;
          targetX = 65;
          targetY = 160;
        } else {
          targetScale = 1.04;
          targetX = 0;
          targetY = 0;
        }
      } else if (idx === 1) {
        // Frame 2: Phong bì to (Bay theo đường cong Bezier từ ghế ra giữa màn hình)
        targetOp = (currentStep === 2) ? 1 : 0;
        if (currentStep >= 2) {
          targetScale = 1.04;
          targetX = 0;
          targetY = 0;
          targetRy = 0;
        } else {
          targetScale = 0.35;
          targetX = -45;
          targetY = -160;
          targetRy = 0.35;
        }
      } else if (idx === 2) {
        // Frame 3: Nắp phong bì mở (Lật 3D)
        targetOp = (currentStep === 3) ? 1 : 0;
        targetScale = (currentStep >= 4) ? 0.94 : 1.04;
        targetY = (currentStep >= 4) ? -35 : 0;
        targetRx = (currentStep === 3) ? -0.06 : 0;
      } else if (idx === 3) {
        // Frame 4: Bức thư trải ra cổ điển (Trượt từ phong bì lên)
        targetOp = (currentStep >= 4) ? 1 : 0;
        targetScale = 1.04;
        targetY = (currentStep >= 4) ? 0 : -75;
      }

      u.o += (targetOp - u.o) * (1 - Math.exp(-dt * (idx === 3 ? 3.2 : 2.5)));
      u.scale += (targetScale - u.scale) * (1 - Math.exp(-dt * 2.8));
      u.x += (targetX - u.x) * (1 - Math.exp(-dt * 2.8));
      u.y += (targetY - u.y) * (1 - Math.exp(-dt * 2.8));
      u.ry += (targetRy - u.ry) * (1 - Math.exp(-dt * 2.8));
      u.rx += (targetRx - u.rx) * (1 - Math.exp(-dt * 2.8));

      p.material.opacity = u.o;
      p.scale.setScalar(u.scale);
      p.position.set(u.x, u.y, idx * 0.4);
      p.rotation.y = u.ry;
      p.rotation.x = u.rx;
    });

    if (currentStep >= 4) {
      txtEl.style.transform = 'scale(' + (1.04 * D / cz) + ')';
    }

    // Di chuyển hạt bụi sáng
    for (let j = 0; j < N; j++) {
      dustPos[j * 3 + 1] += dustSpeeds[j * 2] * dt;
      dustPos[j * 3] += Math.sin(t * 0.5 + dustSpeeds[j * 2 + 1]) * 6 * dt;
      if (dustPos[j * 3 + 1] > 480) dustPos[j * 3 + 1] = -480;
    }
    dustGeo.attributes.position.needsUpdate = true;

    // Tia nắng lướt
    raysMesh.position.x = 80 + Math.sin(t * 0.15) * 40;
    raysMesh.material.opacity = 0.15 + 0.08 * Math.sin(t * 0.5);

    // Lá & Cánh hoa chuyển động
    leaves.forEach((mesh) => {
      if (!mesh.visible) return;
      const u = mesh.userData;
      mesh.position.y -= u.vy * dt;
      mesh.position.x += (u.vx + Math.sin(t * 1.3 + u.phase) * 14) * dt;
      mesh.rotation.x += u.rx * dt;
      mesh.rotation.y += u.ry * dt;
      mesh.rotation.z += u.rz * dt;
      if (mesh.position.y < -450) {
        if (u.isPetal && now > petalsEndTime) {
          mesh.visible = false;
        } else {
          resetLeaf(mesh, false);
        }
      }
    });

    // Tia lửa nứt sáp
    if (burstTime < 2.4) {
      burstTime += dt;
      for (let j = 0; j < B; j++) {
        sparkVel[j * 3 + 1] -= 140 * dt;
        sparkPos[j * 3] += sparkVel[j * 3] * dt;
        sparkPos[j * 3 + 1] += sparkVel[j * 3 + 1] * dt;
        sparkPos[j * 3 + 2] += sparkVel[j * 3 + 2] * dt;
      }
      sparkGeo.attributes.position.needsUpdate = true;
      sparkMat.opacity = Math.max(0, 1 - burstTime / 2.4);
    }

    // Flare loé sáng
    if (flareTime < 1.3) {
      flareTime += dt;
      flareSprite.scale.setScalar(30 + flareTime * 500);
      flareSprite.material.opacity = Math.max(0, 1 - flareTime / 1.3) * 0.9;
    }

    rn.render(sc, cam);
  }
  renderLoop();

  return {
    step: function(stepNum) {
      currentStep = stepNum;
      targetZ = [D, D, D * 0.95, D * 0.9, D][stepNum] || D;

      // Xin quyền cảm biến trên iOS khi chạm
      if (stepNum === 2 && window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try { DeviceOrientationEvent.requestPermission().catch(() => {}); } catch(e) {}
      }

      if (stepNum === 3) {
        triggerBurst();
      }

      if (stepNum === 4) {
        petalsEndTime = performance.now() + CONFIG.timings.petalsDuration;
        leaves.forEach((m) => {
          if (m.userData.isPetal) {
            m.visible = true;
            resetLeaf(m, true);
          }
        });
      }
    }
  };
}

let fx = null;
try {
  fx = initFX();
} catch (e) {
  fx = null;
}

setTimeout(() => { goToStep(1); }, 80);

// =========================================================================
// 5. TƯƠNG TÁC CHẠM BẤT KỲ ĐÂU ĐỂ ĐI TIẾP (Chống bấm đúp & Hỗ trợ Mobile)
// =========================================================================
let isBusy = false;
let lastAdvanceTime = 0;

function handleStageAdvance(e) {
  if (e.target.closest('#btnCal, #btnMap, #btnChangeName, .btn, input, a')) return;
  const now = Date.now();
  if (now - lastAdvanceTime < 450) return;
  lastAdvanceTime = now;

  const rect = st.getBoundingClientRect();
  const scale = rect.width / 393;
  const cx = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : rect.left + rect.width / 2);
  const cy = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : rect.top + rect.height / 2);
  const rip = document.createElement('div');
  rip.className = 'rip';
  rip.style.left = ((cx - rect.left) / scale) + 'px';
  rip.style.top = ((cy - rect.top) / scale) + 'px';
  st.appendChild(rip);
  setTimeout(() => { rip.remove(); }, 850);

  if (isBusy) return;
  const current = +card.dataset.step;
  if (current === 1) {
    goToStep(2);
  } else if (current === 2) {
    isBusy = true;
    goToStep(3);
    setTimeout(() => {
      goToStep(4);
      isBusy = false;
    }, CONFIG.timings.autoStep3to4);
  }
}

card.addEventListener('pointerdown', handleStageAdvance);
card.addEventListener('click', handleStageAdvance);

})();
</script>
